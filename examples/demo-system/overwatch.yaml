# Overwatch config for the demo shop. Run from this folder:
#   overwatch doctor -c overwatch.yaml
#
# Until Zetaris is set up, the two databases are separate direct sources. With Zetaris,
# replace both with a single `zetaris` source that federates shopdb + opsdb, and update the
# catalog to the Zetaris table names, so one query can join metrics, deploys and DB stats.

system:
  name: demo-shop
  description: >
    Online shop. Traffic: client -> gateway (/checkout) -> orders (/orders, reads shopdb.orders by customer_id)
    then gateway -> payments (/pay). payments runs as two replicas (payments-a, payments-b) behind client-side
    load balancing; it charges cards through an external processor (psp.example.com) and writes shopdb.payments.
    gateway calls downstreams with a 1s timeout. Services use a Postgres connection pool and run in containers
    with CPU/memory limits. Every deploy and config change, including other teams' services, is recorded in
    opsdb.deploys. Normal traffic is ~15 checkouts/s; a small background error rate (<1%) is normal.

sources:
  opsdb:
    type: postgres
    url: postgresql+psycopg://overwatch_ro:overwatch_ro@localhost:55432/opsdb
  shopdb:
    type: postgres
    url: postgresql+psycopg://overwatch_ro:overwatch_ro@localhost:55432/shopdb

catalog: |
  opsdb (operations data, Postgres SQL):
    request_metrics(ts timestamptz, service text, instance text, endpoint text, requests int, rps float,
                    p50_ms float, p95_ms float, error_rate float)
      one row per instance+endpoint every 10 seconds. services: gateway, orders, payments
      (payments has instances payments-a and payments-b).
    app_logs(ts timestamptz, service text, instance text, level text, message text)   level INFO, WARN or ERROR
    container_metrics(ts timestamptz, service text, instance text, cpu_pct float, cpu_limit_cores float,
                      mem_mb float, mem_limit_mb float, restarts int, oom_killed boolean, status text)
      every 10 seconds per container (gateway, orders, payments-a, payments-b, postgres). cpu_pct is percent
      of one core; restarts is cumulative; oom_killed means the last exit was an out-of-memory kill.
    deploys(ts timestamptz, service text, version text, author text, description text)
      every code release and config change, for all teams (many are unrelated to any given incident)
    tickets(key text, created timestamptz, title text, status text, resolution text)
      past incident tickets
  shopdb (application database, Postgres SQL):
    orders(id, customer_id int, amount, status, created_at), customers(id, name, created_at),
    payments(id, order_id, amount, status, created_at)
    Postgres catalog views are available here too, e.g.
      pg_indexes(schemaname, tablename, indexname, indexdef)
      pg_stat_user_tables(relname, seq_scan, seq_tup_read, idx_scan, n_live_tup)
      pg_stat_statements(query text, calls bigint, mean_exec_time float, total_exec_time float, rows bigint)
      pg_stat_activity(pid, application_name, state, wait_event_type, wait_event, query, query_start,
                       xact_start, state_change)   -- who is connected and what they are doing/waiting on
      pg_locks(locktype, relation::regclass, mode, granted, pid); pg_blocking_pids(pid) returns blockers
    Service instances connect with application_name shop-<instance>, e.g. shop-orders, shop-payments-a.
  Use now() - interval '...' for time windows. Data is current; compare the last few minutes with the last hour.

topology:  # who calls whom; used for blast radius
  gateway: [orders, payments]
  orders: [postgres]
  payments: [postgres, psp.example.com]

impact:  # business cost since the incident started; {since} is filled in by Overwatch
  - name: failed_checkouts
    label: Failed checkouts
    source: opsdb
    query: >
      SELECT coalesce(sum(requests * error_rate), 0) AS value FROM request_metrics
      WHERE service = 'gateway' AND ts >= {since}
  - name: revenue_at_risk
    label: Revenue at risk
    unit: USD
    source: opsdb
    query: >
      SELECT coalesce(sum(requests * error_rate), 0) * 42.0 AS value FROM request_metrics
      WHERE service = 'gateway' AND ts >= {since}   -- 42 USD is the average checkout in this shop
  - name: slow_checkouts
    label: Checkouts slower than 1s
    source: opsdb
    query: >
      SELECT coalesce(sum(requests) FILTER (WHERE p95_ms > 1000), 0) AS value FROM request_metrics
      WHERE service = 'gateway' AND ts >= {since}

checks:
  - name: orders_p95_latency_ms
    service: orders
    source: opsdb
    query: >
      SELECT avg(p95_ms) AS value FROM request_metrics
      WHERE service = 'orders' AND ts > now() - interval '40 seconds'
    threshold: 150          # hard limit, ~10x normal
    relative_factor: 4      # or 4x its own recent normal...
    relative_min: 60        # ...once it is at least 60ms
    description: orders /orders p95 latency (ms), last 40s
    severity: high
    no_data: alert          # a silent service is a problem too
  - name: gateway_p95_latency_ms
    service: gateway
    source: opsdb
    query: >
      SELECT avg(p95_ms) AS value FROM request_metrics
      WHERE service = 'gateway' AND ts > now() - interval '40 seconds'
    threshold: 600
    relative_factor: 3
    relative_min: 450
    description: gateway /checkout p95 latency (ms), last 40s
    severity: high
    no_data: alert
  - name: payments_error_rate
    service: payments
    source: opsdb
    query: >
      SELECT avg(error_rate) AS value FROM request_metrics
      WHERE service = 'payments' AND ts > now() - interval '40 seconds'
    threshold: 0.05
    description: payments /pay error rate (0-1) across instances, last 40s
    severity: high
  - name: gateway_error_rate
    service: gateway
    source: opsdb
    query: >
      SELECT avg(error_rate) AS value FROM request_metrics
      WHERE service = 'gateway' AND ts > now() - interval '40 seconds'
    threshold: 0.05
    description: gateway /checkout error rate (0-1), last 40s
    severity: critical
  - name: gateway_heartbeat
    kind: heartbeat
    service: gateway
    source: opsdb
    query: >
      SELECT count(*) AS value FROM container_metrics
      WHERE service = 'gateway' AND status = 'running' AND ts > now() - interval '30 seconds'
    comparison: "<"
    threshold: 1
    description: no running gateway container in the last 30s
    severity: critical
  - name: orders_heartbeat
    kind: heartbeat
    service: orders
    source: opsdb
    query: >
      SELECT count(*) AS value FROM container_metrics
      WHERE service = 'orders' AND status = 'running' AND ts > now() - interval '30 seconds'
    comparison: "<"
    threshold: 1
    description: no running orders container in the last 30s
    severity: critical
  - name: payments_heartbeat
    kind: heartbeat
    service: payments
    source: opsdb
    query: >
      SELECT count(*) AS value FROM container_metrics
      WHERE service = 'payments' AND status = 'running' AND ts > now() - interval '30 seconds'
    comparison: "<"
    threshold: 1
    description: no running payments container in the last 30s
    severity: critical
  - name: card_processor_errors
    service: psp.example.com
    source: opsdb
    query: >
      SELECT count(*) AS value FROM app_logs
      WHERE level = 'ERROR' AND message LIKE '%psp.example.com%' AND ts > now() - interval '40 seconds'
    comparison: ">"
    threshold: 5
    description: errors calling the external card processor, last 40s
    severity: high
  - name: container_restarts
    service: containers
    source: opsdb
    query: >
      SELECT max(restarts) - min(restarts) AS value FROM container_metrics
      WHERE ts > now() - interval '3 minutes' GROUP BY instance ORDER BY 1 DESC LIMIT 1
    comparison: ">="
    threshold: 1
    description: container restarts in the last 3 minutes (worst instance)
    severity: high
  - name: database_cpu_pct
    service: postgres
    source: opsdb
    query: >
      SELECT avg(cpu_pct / (coalesce(cpu_limit_cores, 1) * 100)) * 100 AS value FROM container_metrics
      WHERE service = 'postgres' AND ts > now() - interval '40 seconds'
    threshold: 85
    description: database CPU as % of its limit, last 40s
    severity: high

watch:
  interval_seconds: 10
  cooldown_seconds: 300

llm:
  base_url: ${LLM_BASE_URL:-http://127.0.0.1:8088/v1}
  api_key: ${LLM_API_KEY}
  investigator_model: ${OVERWATCH_MODEL:-meterless/text.deep}
  temperature: 0.1
  max_steps: 10

memory:
  type: hmem
  url: ${MEMORY_URL:-http://127.0.0.1:8099}

approval: manual

notifiers:
  - type: console
  - type: slack
    enabled: false
    webhook_url: ${SLACK_WEBHOOK_URL}
  - type: jira
    enabled: false
    base_url: ${JIRA_BASE_URL}
    email: ${JIRA_EMAIL}
    api_token: ${JIRA_API_TOKEN}
    project_key: OPS

trace_dir: traces
