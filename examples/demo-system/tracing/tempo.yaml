# A single-process Tempo for the demo: accepts OpenTelemetry (OTLP) traces on 4317 (gRPC) and 4318 (HTTP), answers queries on 3200.
server:
  http_listen_port: 3200
distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317
ingester:
  max_block_duration: 5m
storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
compactor:
  compaction:
    block_retention: 24h
