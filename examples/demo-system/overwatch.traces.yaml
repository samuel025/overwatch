# GENERATED by scripts/make_traces_config.py from overwatch.yaml. Do not edit by hand.
system:
  name: demo-shop
  description: 'Online shop. Traffic: client -> gateway (/checkout) -> orders (/orders, reads shopdb.orders by customer_id)
    then gateway -> payments (/pay). payments runs as two replicas (payments-a, payments-b) behind client-side load balancing;
    it charges cards through an external processor (psp.example.com) and writes shopdb.payments. gateway calls downstreams
    with a 1s timeout. Services use a Postgres connection pool and run in containers with CPU/memory limits. Every deploy
    and config change, including other teams'' services, is recorded in opsdb.deploys. Normal traffic is ~15 checkouts/s;
    a small background error rate (<1%) is normal.

    '
services:
  gateway:
    what: entry point for /checkout; calls orders, then one payments replica chosen at random
    runs_on: one Docker container, 0.5 CPU, restart policy unless-stopped
    normal: p95 100-250 ms (CPU-limited), errors under 1%, about 15 requests/s
    timeouts: 1000 ms to orders and to payments (configurable, changes appear in deploys as config-*)
  orders:
    what: returns a customer's latest orders from shopdb.orders (3M rows), looked up by customer_id
    runs_on: one Docker container, 0.5 CPU, 256 MB memory limit, restart policy unless-stopped
    normal: p95 about 10 ms, errors under 1%
    known_failures: without the orders_customer_id_idx index every lookup is a sequential scan of 3M rows
  payments:
    what: charges the card via psp.example.com, then inserts into shopdb.payments
    runs_on: two Docker containers (payments-a, payments-b), 0.5 CPU each, DB pool of 10 connections each
    normal: p95 50-100 ms, errors under 1%, traffic split evenly between the two instances
  postgres:
    what: the one database server; shopdb (business data) and opsdb (monitoring data)
    runs_on: one Docker container, 1 CPU
  psp.example.com:
    what: external card processor (third party); we only see it through payments' logs
    normal: about 40 ms per charge
runtime_facts: 'Everything runs on Docker Compose on one host. There is NO Kubernetes, no load balancer, no liveness or

  readiness probes and no autoscaling. Containers restart automatically only if they crash (unless-stopped).

  Container exit codes: 0 = clean stop (stopped on purpose or by an operator), 137 = killed (SIGKILL,

  usually out of memory when oom_killed is true), 143 = terminated (SIGTERM), other = crash.

  A container that is "exited" with restarts unchanged was stopped and is not coming back on its own.

  Deploys and config changes for ALL teams (search, auth, web, notifications...) are in opsdb.deploys;

  most are unrelated to any given incident.

  '
sources:
  opsdb:
    type: postgres
    url: postgresql+psycopg://overwatch_ro:overwatch_ro@localhost:15432/opsdb
  shopdb:
    type: postgres
    url: postgresql+psycopg://overwatch_ro:overwatch_ro@localhost:15432/shopdb
  traces:
    type: traces
    kind: tempo
    url: http://127.0.0.1:3200
catalog: |
  opsdb (operations data, Postgres SQL):
    request_metrics(ts timestamptz, service text, instance text, endpoint text, requests int, rps float,
                    p50_ms float, p95_ms float, error_rate float)
      one row per instance+endpoint every 10 seconds. services: gateway, orders, payments
      (payments has instances payments-a and payments-b).
    app_logs(ts timestamptz, service text, instance text, level text, message text)   level INFO, WARN or ERROR
    container_metrics(ts timestamptz, service text, instance text, cpu_pct float, cpu_limit_cores float,
                      mem_mb float, mem_limit_mb float, restarts int, oom_killed boolean, status text)
      every 10 seconds per container (gateway, orders, payments-a, payments-b, postgres). cpu_pct is percent
      of one core; restarts is cumulative; oom_killed means the last exit was an out-of-memory kill.
    deploys(ts timestamptz, service text, version text, author text, description text)
      every code release and config change, for all teams (many are unrelated to any given incident)
    tickets(key text, created timestamptz, title text, status text, resolution text)
      past incident tickets
  shopdb (application database, Postgres SQL):
    orders(id, customer_id int, amount, status, created_at), customers(id, name, created_at),
    payments(id, order_id, amount, status, created_at)
    Postgres catalog views are available here too, e.g.
      pg_indexes(schemaname, tablename, indexname, indexdef)
      pg_stat_user_tables(relname, seq_scan, seq_tup_read, idx_scan, n_live_tup)
      pg_stat_statements(query text, calls bigint, mean_exec_time float, total_exec_time float, rows bigint)
      pg_stat_activity(pid, application_name, state, wait_event_type, wait_event, query, query_start,
                       xact_start, state_change)   -- who is connected and what they are doing/waiting on
      pg_locks(locktype, relation::regclass, mode, granted, pid); pg_blocking_pids(pid) returns blockers
    Service instances connect with application_name shop-<instance>, e.g. shop-orders, shop-payments-a.
  Use now() - interval '...' for time windows. Data is current; compare the last few minutes with the last hour.

  traces (Tempo, distributed traces: one trace is one request across services). Commands: `slow <service|*> [minutes] [min_ms] [limit]` lists the slowest traces with the span that took the time; `errors <service|*> [minutes] [limit]` lists failing traces with the span where the failure began and its message; `trace <trace_id>` shows one request span by span (who called whom, each span's own time and share of the request); `graph [minutes]` shows who calls whom with call counts, errors and latency; `hotspots <service|*> [minutes]` ranks operations by the time they really spend and says how often each repeats inside one request (a high repeat count is an N+1 query pattern). Services: gateway, orders, payments. Start from `slow` or `errors`, then open one `trace`: it names the cause directly.
topology:
  gateway:
  - orders
  - payments
  orders:
  - postgres
  payments:
  - postgres
  - psp.example.com
impact:
- name: failed_checkouts
  label: Failed checkouts
  source: opsdb
  query: 'SELECT coalesce(sum(requests * error_rate), 0) AS value FROM request_metrics WHERE service = ''gateway'' AND ts
    >= {since}

    '
- name: revenue_at_risk
  label: Revenue at risk
  unit: USD
  source: opsdb
  query: 'SELECT coalesce(sum(requests * error_rate), 0) * 42.0 AS value FROM request_metrics WHERE service = ''gateway''
    AND ts >= {since}   -- 42 USD is the average checkout in this shop

    '
- name: slow_checkouts
  label: Checkouts slower than 1s
  source: opsdb
  query: 'SELECT coalesce(sum(requests) FILTER (WHERE p95_ms > 1000), 0) AS value FROM request_metrics WHERE service = ''gateway''
    AND ts >= {since}

    '
evidence:
- name: recent_changes
  label: Changes in the last 30 minutes
  suspects: true
  source: opsdb
  query: 'SELECT ts, service, version, description FROM deploys WHERE ts > now() - interval ''30 minutes'' ORDER BY ts DESC
    LIMIT 15

    '
- name: top_errors
  label: Top error messages in the last 5 minutes
  source: opsdb
  query: 'SELECT service, instance, left(message, 160) AS message, count(*) AS n FROM app_logs WHERE level = ''ERROR'' AND
    ts > now() - interval ''5 minutes'' GROUP BY 1, 2, 3 ORDER BY n DESC LIMIT 10

    '
- name: service_health
  label: Latency, errors and traffic per instance, last 2 minutes vs last hour
  source: opsdb
  query: "SELECT service, instance,\n  round((avg(p95_ms) FILTER (WHERE ts > now() - interval '2 minutes'))::numeric, 1) AS\
    \ p95_now,\n  round(avg(p95_ms)::numeric, 1) AS p95_hour,\n  round((avg(error_rate) FILTER (WHERE ts > now() - interval\
    \ '2 minutes'))::numeric, 3) AS errors_now,\n  round((avg(rps) FILTER (WHERE ts > now() - interval '2 minutes'))::numeric,\
    \ 1) AS rps_now,\n  round(avg(rps)::numeric, 1) AS rps_hour\nFROM request_metrics WHERE ts > now() - interval '1 hour'\
    \ GROUP BY 1, 2 ORDER BY 1, 2\n"
- name: containers
  label: Container state now
  source: opsdb
  query: "SELECT DISTINCT ON (instance) instance, status, restarts, oom_killed,\n  round(cpu_pct::numeric, 1) AS cpu_pct,\
    \ round(mem_mb::numeric) AS mem_mb, mem_limit_mb\nFROM container_metrics WHERE ts > now() - interval '1 minute' ORDER\
    \ BY instance, ts DESC\n"
- name: db_activity
  label: Database sessions that are busy or waiting
  source: shopdb
  query: "SELECT application_name, state, wait_event_type, wait_event, left(query, 120) AS query,\n  clock_timestamp() - query_start\
    \ AS running_for\nFROM pg_stat_activity WHERE datname = 'shopdb' AND state <> 'idle' AND pid <> pg_backend_pid() ORDER\
    \ BY query_start LIMIT 10\n"
- name: traces_slowest
  label: Slowest traces, last 5 minutes (with the span that took the time)
  source: traces
  query: slow * 5 0 5
- name: traces_failing
  label: Failing traces, last 5 minutes (with the span where the failure began)
  source: traces
  query: errors * 5 5
- name: traces_hotspots
  label: Where requests spend their time, last 5 minutes (repeats per request flagged)
  source: traces
  query: hotspots * 5
events:
- type: docker
  service_label: shop.service
  instance_label: shop.instance
  filters:
    label:
    - com.docker.compose.project=${COMPOSE_PROJECT_NAME:-demo-system}
checks:
- name: gateway_probe
  kind: probe
  service: gateway
  url: http://127.0.0.1:8001/health
  timeout_ms: 1500
  description: gateway answered its health check
  severity: critical
- name: orders_probe
  kind: probe
  service: orders
  url: http://127.0.0.1:8002/health
  timeout_ms: 1500
  description: orders answered its health check
  severity: critical
- name: orders_p95_latency_ms
  service: orders
  source: opsdb
  query: 'SELECT avg(p95_ms) AS value FROM request_metrics WHERE service = ''orders'' AND ts > now() - interval ''40 seconds''

    '
  threshold: 150
  relative_factor: 4
  relative_min: 60
  description: orders /orders p95 latency (ms), last 40s
  severity: high
  no_data: alert
- name: gateway_p95_latency_ms
  service: gateway
  source: opsdb
  query: 'SELECT avg(p95_ms) AS value FROM request_metrics WHERE service = ''gateway'' AND ts > now() - interval ''40 seconds''

    '
  threshold: 600
  relative_factor: 3
  relative_min: 450
  description: gateway /checkout p95 latency (ms), last 40s
  severity: high
  no_data: alert
- name: payments_error_rate
  service: payments
  source: opsdb
  query: 'SELECT avg(error_rate) AS value FROM request_metrics WHERE service = ''payments'' AND ts > now() - interval ''40
    seconds''

    '
  threshold: 0.05
  description: payments /pay error rate (0-1) across instances, last 40s
  severity: high
- name: gateway_error_rate
  service: gateway
  source: opsdb
  query: 'SELECT avg(error_rate) AS value FROM request_metrics WHERE service = ''gateway'' AND ts > now() - interval ''40
    seconds''

    '
  threshold: 0.05
  description: gateway /checkout error rate (0-1), last 40s
  severity: critical
- name: gateway_heartbeat
  kind: heartbeat
  service: gateway
  source: opsdb
  query: 'SELECT count(*) AS value FROM container_metrics WHERE service = ''gateway'' AND status = ''running'' AND ts > now()
    - interval ''30 seconds''

    '
  comparison: <
  threshold: 1
  description: no running gateway container in the last 30s
  severity: critical
- name: orders_heartbeat
  kind: heartbeat
  service: orders
  source: opsdb
  query: 'SELECT count(*) AS value FROM container_metrics WHERE service = ''orders'' AND status = ''running'' AND ts > now()
    - interval ''30 seconds''

    '
  comparison: <
  threshold: 1
  description: no running orders container in the last 30s
  severity: critical
- name: payments_heartbeat
  kind: heartbeat
  service: payments
  source: opsdb
  query: 'SELECT count(*) AS value FROM container_metrics WHERE service = ''payments'' AND status = ''running'' AND ts > now()
    - interval ''30 seconds''

    '
  comparison: <
  threshold: 1
  description: no running payments container in the last 30s
  severity: critical
- name: card_processor_errors
  service: psp.example.com
  source: opsdb
  query: 'SELECT count(*) AS value FROM app_logs WHERE level = ''ERROR'' AND message LIKE ''%psp.example.com%'' AND ts > now()
    - interval ''40 seconds''

    '
  comparison: '>'
  threshold: 5
  description: errors calling the external card processor, last 40s
  severity: high
- name: container_restarts
  service: containers
  source: opsdb
  query: 'SELECT max(restarts) - min(restarts) AS value FROM container_metrics WHERE ts > now() - interval ''3 minutes'' GROUP
    BY instance ORDER BY 1 DESC LIMIT 1

    '
  comparison: '>='
  threshold: 1
  description: container restarts in the last 3 minutes (worst instance)
  severity: high
- name: database_cpu_pct
  service: postgres
  source: opsdb
  query: 'SELECT avg(cpu_pct / (coalesce(cpu_limit_cores, 1) * 100)) * 100 AS value FROM container_metrics WHERE service =
    ''postgres'' AND ts > now() - interval ''40 seconds''

    '
  threshold: 85
  description: database CPU as % of its limit, last 40s
  severity: high
watch:
  interval_seconds: 5
  confirm_samples: 2
  cooldown_seconds: 300
llm:
