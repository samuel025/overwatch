# Overwatch config for the demo shop. Run from this folder:
#   overwatch doctor -c overwatch.yaml
#
# GENERATED by scripts/make_zetaris_config.py from overwatch.yaml. Do not edit by hand.
# Zetaris is the data layer: shopdb + opsdb are registered in it and one query can join metrics,
# deploys and business tables. Run `python scripts/register_zetaris.py` once first.

system:
  name: demo-shop
  description: >
    Online shop. Traffic: client -> gateway (/checkout) -> orders (/orders, reads shopdb.orders by customer_id)
    then gateway -> payments (/pay). payments runs as two replicas (payments-a, payments-b) behind client-side
    load balancing; it charges cards through an external processor (psp.example.com) and writes shopdb.payments.
    gateway calls downstreams with a 1s timeout. Services use a Postgres connection pool and run in containers
    with CPU/memory limits. Every deploy and config change, including other teams' services, is recorded in
    opsdb.deploys. Normal traffic is ~15 checkouts/s; a small background error rate (<1%) is normal.

# What an engineer would tell a newcomer about each service. Passed to the Investigator as fact.
services:
  gateway:
    what: entry point for /checkout; calls orders, then one payments replica chosen at random
    runs_on: one Docker container, 0.5 CPU, restart policy unless-stopped
    normal: p95 100-250 ms (CPU-limited), errors under 1%, about 15 requests/s
    timeouts: 1000 ms to orders and to payments (configurable, changes appear in deploys as config-*)
  orders:
    what: returns a customer's latest orders from shopdb.orders (3M rows), looked up by customer_id
    runs_on: one Docker container, 0.5 CPU, 256 MB memory limit, restart policy unless-stopped
    normal: p95 about 10 ms, errors under 1%
    known_failures: without the orders_customer_id_idx index every lookup is a sequential scan of 3M rows
  payments:
    what: charges the card via psp.example.com, then inserts into shopdb.payments
    runs_on: two Docker containers (payments-a, payments-b), 0.5 CPU each, DB pool of 10 connections each
    normal: p95 50-100 ms, errors under 1%, traffic split evenly between the two instances
  postgres:
    what: the one database server; shopdb (business data) and opsdb (monitoring data)
    runs_on: one Docker container, 1 CPU
  psp.example.com:
    what: external card processor (third party); we only see it through payments' logs
    normal: about 40 ms per charge

runtime_facts: |
  Everything runs on Docker Compose on one host. There is NO Kubernetes, no load balancer, no liveness or
  readiness probes and no autoscaling. Containers restart automatically only if they crash (unless-stopped).
  Container exit codes: 0 = clean stop (stopped on purpose or by an operator), 137 = killed (SIGKILL,
  usually out of memory when oom_killed is true), 143 = terminated (SIGTERM), other = crash.
  A container that is "exited" with restarts unchanged was stopped and is not coming back on its own.
  Deploys and config changes for ALL teams (search, auth, web, notifications...) are in opsdb.deploys;
  most are unrelated to any given incident.

sources:
  zetaris:
    type: zetaris
    jdbc_url: ${ZETARIS_JDBC_URL}
    driver_class: ${ZETARIS_DRIVER_CLASS}
    driver_jar: ${ZETARIS_DRIVER_JAR}
    username: ${ZETARIS_USER}
    password: ${ZETARIS_PASSWORD}
  shopdb_live:        # live Postgres internals (sessions, locks, indexes) are not tables Zetaris can register
    type: postgres
    url: postgresql+psycopg://overwatch_ro:overwatch_ro@localhost:55432/shopdb

catalog: |
  All business and monitoring data is in Zetaris (Spark SQL). Tables are written <database>.<table>, and one
  query may join tables from both databases.
  opsdb (operations data):
    opsdb.request_metrics(ts, service, instance, endpoint, requests, rps, p50_ms, p95_ms, error_rate)
      one row per instance+endpoint every 10 seconds. services: gateway, orders, payments
      (payments has instances payments-a and payments-b).
    opsdb.app_logs(ts, service, instance, level, message)   level INFO, WARN or ERROR
    opsdb.container_metrics(ts, service, instance, cpu_pct, cpu_limit_cores, mem_mb, mem_limit_mb, restarts,
                            oom_killed, status)
      every 10 seconds per container (gateway, orders, payments-a, payments-b, postgres). cpu_pct is percent
      of one core; restarts is cumulative; oom_killed means the last exit was an out-of-memory kill.
    opsdb.deploys(ts, service, version, author, description)
      every code release and config change, for all teams (many are unrelated to any given incident)
    opsdb.tickets(key, created, title, status, resolution)   past incident tickets
  shopdb (application database):
    shopdb.orders(id, customer_id, amount, status, created_at), shopdb.customers(id, name, created_at),
    shopdb.payments(id, order_id, amount, status, created_at)
    A query can join across the two databases, e.g. opsdb.deploys with shopdb.payments to see what a release did to payments.
    shopdb.pg_stat_statements(query, calls, mean_exec_time, total_exec_time, rows)
  Live Postgres internals are NOT in Zetaris. Query them with source shopdb_live (Postgres SQL):
      pg_indexes(schemaname, tablename, indexname, indexdef)
      pg_stat_user_tables(relname, seq_scan, seq_tup_read, idx_scan, n_live_tup)
      pg_stat_activity(pid, application_name, state, wait_event_type, wait_event, query, query_start,
                       xact_start, state_change)   -- who is connected and what they are doing/waiting on
      pg_locks(locktype, relation::regclass, mode, granted, pid); pg_blocking_pids(pid) returns blockers
    Service instances connect with application_name shop-<instance>, e.g. shop-orders, shop-payments-a.
  Time windows in Zetaris: ts > current_timestamp() - INTERVAL 5 MINUTES (units: SECONDS, MINUTES, HOURS, DAYS).
  Data is current; compare the last few minutes with the last hour.

topology:  # who calls whom; used for blast radius
  gateway: [orders, payments]
  orders: [postgres]
  payments: [postgres, psp.example.com]

impact:  # business cost since the incident started; {since} is filled in by Overwatch
  - name: failed_checkouts
    label: Failed checkouts
    source: zetaris
    query: >
      SELECT coalesce(sum(requests * error_rate), 0) AS value FROM opsdb.request_metrics
      WHERE service = 'gateway' AND ts >= {since}
  - name: revenue_at_risk
    label: Revenue at risk
    unit: USD
    source: zetaris
    query: >
      SELECT coalesce(sum(requests * error_rate), 0) * 42.0 AS value FROM opsdb.request_metrics
      WHERE service = 'gateway' AND ts >= {since}   -- 42 USD is the average checkout in this shop
  - name: slow_checkouts
    label: Checkouts slower than 1s
    source: zetaris
    query: >
      SELECT coalesce(sum(requests) FILTER (WHERE p95_ms > 1000), 0) AS value FROM opsdb.request_metrics
      WHERE service = 'gateway' AND ts >= {since}

# The evidence pack: standard queries run in parallel the moment an incident opens, so the
# Investigator starts with the basics instead of spending its first steps fetching them.
evidence:
  - name: recent_changes
    label: Changes in the last 30 minutes
    source: zetaris
    query: >
      SELECT ts, service, version, description FROM opsdb.deploys
      WHERE ts > current_timestamp() - INTERVAL 30 MINUTE ORDER BY ts DESC LIMIT 15
  - name: deploys_vs_payments
    label: Payments per minute before and after each recent change (joins opsdb.deploys with shopdb.payments)
    source: zetaris
    query: >
      SELECT d.ts AS deployed_at, d.service, d.version,
        round(sum(CASE WHEN p.created_at >= d.ts - INTERVAL 5 MINUTES AND p.created_at < d.ts THEN 1 ELSE 0 END) / 5.0, 1) AS payments_per_min_before,
        round(sum(CASE WHEN p.created_at >= d.ts AND p.created_at < d.ts + INTERVAL 5 MINUTES THEN 1 ELSE 0 END) / 5.0, 1) AS payments_per_min_after
      FROM opsdb.deploys d CROSS JOIN shopdb.payments p
      WHERE d.ts > current_timestamp() - INTERVAL 30 MINUTES AND p.created_at > current_timestamp() - INTERVAL 40 MINUTES
      GROUP BY d.ts, d.service, d.version ORDER BY d.ts DESC LIMIT 8
  - name: top_errors
    label: Top error messages in the last 5 minutes
    source: zetaris
    query: >
      SELECT service, instance, left(message, 160) AS message, count(*) AS n FROM opsdb.app_logs
      WHERE level = 'ERROR' AND ts > current_timestamp() - INTERVAL 5 MINUTE
      GROUP BY 1, 2, 3 ORDER BY n DESC LIMIT 10
  - name: service_health
    label: Latency, errors and traffic per instance, last 2 minutes vs last hour
    source: zetaris
    query: >
      SELECT service, instance,
        round((avg(p95_ms) FILTER (WHERE ts > current_timestamp() - INTERVAL 2 MINUTE)), 1) AS p95_now,
        round(avg(p95_ms), 1) AS p95_hour,
        round((avg(error_rate) FILTER (WHERE ts > current_timestamp() - INTERVAL 2 MINUTE)), 3) AS errors_now,
        round((avg(rps) FILTER (WHERE ts > current_timestamp() - INTERVAL 2 MINUTE)), 1) AS rps_now,
        round(avg(rps), 1) AS rps_hour
      FROM opsdb.request_metrics WHERE ts > current_timestamp() - INTERVAL 1 HOUR GROUP BY 1, 2 ORDER BY 1, 2
  - name: containers
    label: Container state now
    source: zetaris
    query: >
      SELECT instance, status, restarts, oom_killed, round(cpu_pct, 1) AS cpu_pct, round(mem_mb) AS mem_mb, mem_limit_mb
      FROM (SELECT *, row_number() OVER (PARTITION BY instance ORDER BY ts DESC) AS rn FROM opsdb.container_metrics
            WHERE ts > current_timestamp() - INTERVAL 1 MINUTE) WHERE rn = 1 ORDER BY instance
  - name: db_activity
    label: Database sessions that are busy or waiting
    source: shopdb_live
    query: >
      SELECT application_name, state, wait_event_type, wait_event, left(query, 120) AS query,
        now() - query_start AS running_for
      FROM pg_stat_activity WHERE datname = 'shopdb' AND state <> 'idle' AND pid <> pg_backend_pid()
      ORDER BY query_start LIMIT 10

# Pushed events: Docker tells Overwatch the instant a container dies, is OOM-killed or starts.
events:
  - type: docker
    service_label: shop.service
    instance_label: shop.instance
    filters:
      label: ["com.docker.compose.project=demo-system"]

checks:
  - name: gateway_probe
    kind: probe
    service: gateway
    url: http://127.0.0.1:8001/health
    timeout_ms: 1500
    description: gateway answered its health check
    severity: critical
  - name: orders_probe
    kind: probe
    service: orders
    url: http://127.0.0.1:8002/health
    timeout_ms: 1500
    description: orders answered its health check
    severity: critical
  - name: orders_p95_latency_ms
    service: orders
    source: zetaris
    query: >
      SELECT avg(p95_ms) AS value FROM opsdb.request_metrics
      WHERE service = 'orders' AND ts > current_timestamp() - INTERVAL 40 SECOND
    threshold: 150          # hard limit, ~10x normal
    relative_factor: 4      # or 4x its own recent normal...
    relative_min: 60        # ...once it is at least 60ms
    description: orders /orders p95 latency (ms), last 40s
    severity: high
    no_data: alert          # a silent service is a problem too
  - name: gateway_p95_latency_ms
    service: gateway
    source: zetaris
    query: >
      SELECT avg(p95_ms) AS value FROM opsdb.request_metrics
      WHERE service = 'gateway' AND ts > current_timestamp() - INTERVAL 40 SECOND
    threshold: 600
    relative_factor: 3
    relative_min: 450
    description: gateway /checkout p95 latency (ms), last 40s
    severity: high
    no_data: alert
  - name: payments_error_rate
    service: payments
    source: zetaris
    query: >
      SELECT avg(error_rate) AS value FROM opsdb.request_metrics
      WHERE service = 'payments' AND ts > current_timestamp() - INTERVAL 40 SECOND
    threshold: 0.05
    description: payments /pay error rate (0-1) across instances, last 40s
    severity: high
  - name: gateway_error_rate
    service: gateway
    source: zetaris
    query: >
      SELECT avg(error_rate) AS value FROM opsdb.request_metrics
      WHERE service = 'gateway' AND ts > current_timestamp() - INTERVAL 40 SECOND
    threshold: 0.05
    description: gateway /checkout error rate (0-1), last 40s
    severity: critical
  - name: gateway_heartbeat
    kind: heartbeat
    service: gateway
    source: zetaris
    query: >
      SELECT count(*) AS value FROM opsdb.container_metrics
      WHERE service = 'gateway' AND status = 'running' AND ts > current_timestamp() - INTERVAL 30 SECOND
    comparison: "<"
    threshold: 1
    description: no running gateway container in the last 30s
    severity: critical
  - name: orders_heartbeat
    kind: heartbeat
    service: orders
    source: zetaris
    query: >
      SELECT count(*) AS value FROM opsdb.container_metrics
      WHERE service = 'orders' AND status = 'running' AND ts > current_timestamp() - INTERVAL 30 SECOND
    comparison: "<"
    threshold: 1
    description: no running orders container in the last 30s
    severity: critical
  - name: payments_heartbeat
    kind: heartbeat
    service: payments
    source: zetaris
    query: >
      SELECT count(*) AS value FROM opsdb.container_metrics
      WHERE service = 'payments' AND status = 'running' AND ts > current_timestamp() - INTERVAL 30 SECOND
    comparison: "<"
    threshold: 1
    description: no running payments container in the last 30s
    severity: critical
  - name: card_processor_errors
    service: psp.example.com
    source: zetaris
    query: >
      SELECT count(*) AS value FROM opsdb.app_logs
      WHERE level = 'ERROR' AND message LIKE '%psp.example.com%' AND ts > current_timestamp() - INTERVAL 40 SECOND
    comparison: ">"
    threshold: 5
    description: errors calling the external card processor, last 40s
    severity: high
  - name: container_restarts
    service: containers
    source: zetaris
    query: >
      SELECT max(restarts) - min(restarts) AS value FROM opsdb.container_metrics
      WHERE ts > current_timestamp() - INTERVAL 3 MINUTE GROUP BY instance ORDER BY 1 DESC LIMIT 1
    comparison: ">="
    threshold: 1
    description: container restarts in the last 3 minutes (worst instance)
    severity: high
  - name: database_cpu_pct
    service: postgres
    source: zetaris
    query: >
      SELECT avg(cpu_pct / (coalesce(cpu_limit_cores, 1) * 100)) * 100 AS value FROM opsdb.container_metrics
      WHERE service = 'postgres' AND ts > current_timestamp() - INTERVAL 40 SECOND
    threshold: 85
    description: database CPU as % of its limit, last 40s
    severity: high

watch:
  interval_seconds: 5
  confirm_samples: 2        # one bad pass shows as "possible problem"; two in a row open an incident
  cooldown_seconds: 300

llm:
  base_url: ${LLM_BASE_URL:-http://127.0.0.1:8088/v1}
  api_key: ${LLM_API_KEY}
  investigator_model: ${OVERWATCH_MODEL:-meterless/text.deep}
  triage_model: ${OVERWATCH_TRIAGE_MODEL:-meterless/text.fast}   # fast first guess
  triage_extra_body:            # answer directly instead of reasoning at length (Nemotron); ignored elsewhere
    chat_template_kwargs: {enable_thinking: false}
  temperature: 0.1
  max_steps: 8

memory:
  type: hmem
  url: ${MEMORY_URL:-http://127.0.0.1:8099}

approval: manual

notifiers:
  - type: console
  - type: slack
    enabled: false
    webhook_url: ${SLACK_WEBHOOK_URL}
  - type: jira
    enabled: false
    base_url: ${JIRA_BASE_URL}
    email: ${JIRA_EMAIL}
    api_token: ${JIRA_API_TOKEN}
    project_key: OPS

trace_dir: traces
