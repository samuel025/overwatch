[project]
name = "overwatch"
version = "0.1.0"
description = "Multi-agent incident investigator: watches any system, explains why it broke, reports to Slack and Jira."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "openai>=1.40",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
zetaris = ["jaydebeapi>=1.2"]

[project.scripts]
overwatch = "overwatch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["overwatch"]
